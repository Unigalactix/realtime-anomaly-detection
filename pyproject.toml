[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-stream"
version = "0.1.0"
description = "Real-time anomaly detection in streaming logs/metrics — numpy-only detectors, drift detection, and explainable alerts"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rajesh Kodaganti" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
keywords = ["anomaly-detection", "streaming", "machine-learning", "isolation-forest", "autoencoder", "drift-detection"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools.packages.find]
where = ["src"]
